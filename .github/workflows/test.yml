name: Card tests
on:
  push:
    branches: [feature/v2-metrics]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check proxmox-guest-card.js
      - run: node test.cjs
